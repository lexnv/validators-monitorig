<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Validator Monitor Pro // System Alpha</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2710%27 fill=%27%23ff2d95%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
    --font-sans: 'Inter', -apple-system, 'Segoe UI', sans-serif;

    --bg: #07081a;
    --text: #f2f3ff;
    --text-dim: #9a9fbf;

    /* rgb triplets so they can be mixed with alpha */
    --pink: 255, 45, 149;
    --lav: 190, 150, 255;
    --cyan: 110, 220, 255;
    --green: 40, 255, 170;
    --red: 255, 70, 95;
    --amber: 255, 179, 64;
    --white: 235, 240, 255;

    --accent: rgb(var(--pink));
    --accent-glow: rgba(var(--pink), 0.45);

    --glass: rgba(16, 18, 44, 0.42);
    --glass-border: rgba(255, 255, 255, 0.12);
    --glass-border-hi: rgba(255, 255, 255, 0.24);
    --well: rgba(3, 4, 16, 0.55);
    --radius: 14px;
  }

  html { scrollbar-color: rgba(255,255,255,0.14) #06071a; }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: #06071a; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 999px; border: 2px solid #06071a; }
  ::selection { background: rgba(var(--pink), 0.45); color: #fff; }

  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Animated Background ── */
  #bg-river { position: fixed; inset: 0; z-index: -3; width: 100%; height: 100%; display: block; }
  .bg-dots {
    position: fixed; inset: 0; z-index: -2; pointer-events: none; opacity: 0.8;
    background-image: radial-gradient(rgba(255,255,255,0.14) 1px, transparent 1.4px);
    background-size: 18px 18px;
    -webkit-mask-image:
      radial-gradient(ellipse 45% 40% at 12% 12%, #000 0%, transparent 100%),
      radial-gradient(ellipse 40% 45% at 92% 62%, #000 0%, transparent 100%),
      radial-gradient(ellipse 35% 30% at 30% 95%, #000 0%, transparent 100%);
    mask-image:
      radial-gradient(ellipse 45% 40% at 12% 12%, #000 0%, transparent 100%),
      radial-gradient(ellipse 40% 45% at 92% 62%, #000 0%, transparent 100%),
      radial-gradient(ellipse 35% 30% at 30% 95%, #000 0%, transparent 100%);
  }
  .bg-vignette {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(ellipse 80% 70% at 50% 45%, transparent 50%, rgba(2, 3, 12, 0.6) 100%);
  }

  /* ── Glass primitives ── */
  .panel, .stat-card, .card, .controls {
    background:
      linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.015)),
      var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    backdrop-filter: blur(18px) saturate(140%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.10), 0 10px 40px -10px rgba(0,0,0,0.6);
  }

  /* ── Outer glass shell ── */
  .shell {
    position: relative; z-index: 1;
    max-width: 1240px; margin: 28px auto; padding: 40px 44px 48px;
    border-radius: 26px;
    background: linear-gradient(180deg, rgba(30, 34, 80, 0.22), rgba(12, 14, 40, 0.30));
    border: 1px solid rgba(255,255,255,0.13);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.16),
      inset 0 0 0 1px rgba(255,255,255,0.02),
      0 40px 120px rgba(0,0,0,0.55);
  }

  /* ── Header ── */
  .header { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; margin-bottom: 36px; flex-wrap: wrap; }
  .header h1 {
    font-size: clamp(2.2rem, 5vw, 3.6rem); font-weight: 900; letter-spacing: -0.03em; line-height: 1;
    text-transform: uppercase; margin-bottom: 14px;
    background: linear-gradient(90deg, #ff2d95 0%, #f24fb0 30%, #c77dff 62%, #b9b3ff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px rgba(255, 45, 149, 0.35));
  }
  .sys-status {
    font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 0.12em;
    text-transform: uppercase; color: rgba(255,255,255,0.86);
  }
  .header-meta { text-align: right; padding-top: 10px; }
  .powered { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.08em; color: var(--text-dim); }
  .powered a { color: #dfe3ff; text-decoration: none; font-weight: 600; letter-spacing: 0.1em; }
  .powered a:hover { color: var(--accent); }
  .last-updated { font-family: var(--font-mono); font-size: 1.05rem; color: #fff; margin-top: 6px; }
  .ts-label { font-size: 0.6rem; color: var(--text-dim); letter-spacing: 0.1em; margin-right: 8px; vertical-align: middle; }

  /* ── Controls ── */
  .controls { padding: 18px; margin-bottom: 26px; display: flex; flex-direction: column; gap: 16px; }
  .search-wrap { position: relative; }
  .search-input {
    width: 100%; background: var(--well); border: 1px solid rgba(255,255,255,0.10);
    border-radius: 12px; padding: 14px 18px 14px 20px; color: #fff;
    font: 600 0.82rem/1 var(--font-mono); letter-spacing: 0.06em; outline: none;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.35);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-input::placeholder { color: rgba(220,224,255,0.55); }
  .search-input:focus {
    border-color: rgba(var(--pink), 0.55);
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.35), 0 0 0 3px rgba(var(--pink), 0.12), 0 0 24px rgba(var(--pink), 0.18);
  }
  /* decorative data-dot texture on the right side of the search bar */
  .search-wrap::after {
    content: ''; position: absolute; top: 8px; bottom: 8px; right: 14px; width: 42%;
    pointer-events: none; border-radius: 8px; opacity: 0.55; transition: opacity 0.3s;
    background-image:
      radial-gradient(rgba(var(--cyan), 0.6) 0.8px, transparent 1.2px),
      radial-gradient(rgba(var(--lav), 0.5) 0.8px, transparent 1.2px);
    background-size: 7px 7px, 11px 11px; background-position: 0 0, 3px 4px;
    -webkit-mask-image: linear-gradient(90deg, transparent, rgba(0,0,0,0.9) 55%, rgba(0,0,0,0.5));
    mask-image: linear-gradient(90deg, transparent, rgba(0,0,0,0.9) 55%, rgba(0,0,0,0.5));
  }
  .search-wrap:has(.search-input:not(:placeholder-shown))::after,
  .search-wrap:has(.search-input:focus)::after { opacity: 0; }

  .filter-group { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .tabs {
    display: flex; gap: 4px; padding: 4px; border-radius: 12px;
    background: rgba(0,0,0,0.28); border: 1px solid rgba(255,255,255,0.10);
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.4);
  }
  .tab-btn {
    padding: 9px 22px; border: none; background: transparent; color: rgba(230,233,255,0.75);
    cursor: pointer; font: 600 0.72rem var(--font-mono); letter-spacing: 0.06em;
    text-transform: uppercase; transition: 0.25s; border-radius: 8px;
  }
  .tab-btn:hover { color: #fff; background: rgba(255,255,255,0.06); }
  .tab-btn.active {
    background: rgba(236, 240, 255, 0.92); color: #101228;
    box-shadow: 0 2px 12px rgba(255,255,255,0.18), inset 0 1px 0 #fff;
  }

  .action-btn {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); color: #e8e8f5;
    padding: 10px 18px; border-radius: 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    font: 600 0.72rem var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08); transition: 0.2s;
  }
  .action-btn:hover {
    border-color: rgba(var(--pink), 0.6); background: rgba(var(--pink), 0.12); color: #fff;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 0 18px rgba(var(--pink), 0.25);
  }
  .action-btn span { color: #fff; }

  /* ── Stats ── */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; margin-bottom: 26px; }
  .stat-card {
    --c: var(--white);
    position: relative; padding: 16px 18px 18px; cursor: pointer; overflow: hidden;
    border-color: rgba(var(--c), 0.32);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.10), 0 0 28px -10px rgba(var(--c), 0.45);
    transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s, background 0.25s;
  }
  .stat-card:hover { transform: translateY(-2px); border-color: rgba(var(--c), 0.6); }
  .stat-card.active {
    border-color: rgba(var(--c), 0.75);
    background: linear-gradient(160deg, rgba(var(--c), 0.18), rgba(var(--c), 0.03)), var(--glass);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), 0 0 34px -6px rgba(var(--c), 0.55);
  }
  .stat-card::after {
    content: ''; position: absolute; right: -1px; bottom: -1px; width: 0; height: 0;
    border-style: solid; border-width: 0 0 16px 16px;
    border-color: transparent transparent rgba(var(--c), 0.55) transparent;
  }
  .stat-card.info { cursor: default; }
  .stat-card.info:hover { transform: none; border-color: rgba(var(--c), 0.32); }
  .stat-copy {
    position: absolute; top: 12px; right: 12px; background: transparent; border: none;
    color: rgba(var(--c), 0.8); cursor: pointer; padding: 4px; border-radius: 6px; line-height: 0;
    opacity: 0.8; transition: 0.2s;
  }
  .stat-copy:hover { opacity: 1; background: rgba(255,255,255,0.08); }
  .stat-label {
    font: 600 0.62rem var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase;
    color: rgba(235,238,255,0.8); margin-bottom: 8px; padding-right: 28px;
  }
  .stat-value {
    font: 800 2rem/1 var(--font-mono); letter-spacing: -0.02em;
    color: rgb(var(--c)); text-shadow: 0 0 16px rgba(var(--c), 0.5);
  }
  .stat-sub { font-size: 1rem; font-weight: 600; color: var(--text-dim); text-shadow: none; }
  .t-pink  { --c: var(--pink); }
  .t-green { --c: var(--green); }
  .t-red   { --c: var(--red); }
  .t-cyan  { --c: var(--cyan); }
  .t-white { --c: var(--white); }

  /* ── Distribution panels ── */
  .panel { padding: 20px 22px; margin-bottom: 22px; }
  .panel-title {
    font: 600 0.62rem var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase;
    color: rgba(225,228,255,0.7); margin-bottom: 14px;
  }
  .panel-title .filter-flag { color: var(--accent); }
  .version-row {
    display: grid; grid-template-columns: 130px minmax(0, 1fr) 120px; gap: 16px;
    align-items: center; padding: 7px 10px; cursor: pointer; border-radius: 8px;
    border-left: 2px solid transparent; transition: background 0.2s;
  }
  .version-row:hover { background: rgba(255,255,255,0.04); }
  .version-row.active { background: rgba(var(--pink), 0.10); border-left-color: var(--accent); }
  .version-name {
    font: 600 0.74rem var(--font-mono); color: #e9ebff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .version-track {
    height: 6px; border-radius: 999px; background: rgba(255,255,255,0.08);
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.4); overflow: hidden;
  }
  .version-fill {
    height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, #ff2d95 0%, #e560c8 45%, #c9a6ff 80%, #f4efff 100%);
    box-shadow: 0 0 10px rgba(var(--pink), 0.55), 0 0 2px rgba(255,255,255,0.6);
    transform-origin: left; animation: growX 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  }
  .version-fill.unknown { background: linear-gradient(90deg, rgba(255,255,255,0.35), rgba(255,255,255,0.12)); box-shadow: none; }
  .version-fill.net { background: linear-gradient(90deg, #3ec9ff, #8ad8ff 60%, #e9f8ff); box-shadow: 0 0 10px rgba(var(--cyan), 0.5); }
  .version-count { font: 600 0.72rem var(--font-mono); color: #fff; text-align: right; white-space: nowrap; }
  .version-count .pct { color: var(--text-dim); }
  @keyframes growX { from { transform: scaleX(0); } }

  /* ── Network scan ── */
  .version-row.static { cursor: default; }
  .version-row.static:hover { background: transparent; }
  .allnodes-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .meta-chip {
    display: flex; align-items: center; gap: 10px; padding: 7px 14px;
    background: var(--well); border: 1px solid rgba(255,255,255,0.08); border-radius: 9px;
    font-family: var(--font-mono);
  }
  .meta-chip .chip-label { color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.6rem; }
  .meta-chip .chip-value { color: #fff; font-weight: 700; font-size: 0.76rem; }

  /* ── Validator cards ── */
  .list-container { display: flex; flex-direction: column; gap: 18px; }
  .card {
    padding: 22px 24px; position: relative;
    content-visibility: auto; contain-intrinsic-size: auto 280px;
    animation: slideIn 0.35s ease-out both;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
  }
  .card:hover {
    border-color: var(--glass-border-hi); transform: translateY(-2px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 18px 50px -12px rgba(0,0,0,0.7), 0 0 30px -10px rgba(var(--pink), 0.25);
  }
  .card-header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
  .badges { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }

  .pulse { width: 12px; height: 12px; border-radius: 50%; position: relative; flex-shrink: 0; }
  .pulse.online { color: rgb(var(--green)); }
  .pulse.offline { color: rgb(var(--red)); }
  .pulse { background: currentColor; box-shadow: 0 0 12px currentColor, 0 0 0 3px rgba(0,0,0,0.35); }
  .pulse::after {
    content: ''; position: absolute; inset: -4px; border-radius: 50%;
    border: 2px solid currentColor; animation: pulse-ring 1.8s ease-out infinite;
  }
  .pulse.offline::after { animation-duration: 2.6s; opacity: 0.7; }
  @keyframes pulse-ring { 0% { transform: scale(0.7); opacity: 1; } 100% { transform: scale(2.2); opacity: 0; } }

  .identity-name {
    font: 800 1.05rem var(--font-sans); letter-spacing: 0.02em; text-transform: uppercase;
    color: #fff; min-width: 0; word-break: break-word;
  }
  .badge {
    font: 600 0.6rem var(--font-mono); letter-spacing: 0.08em; padding: 5px 12px; border-radius: 999px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); color: #e6e8ff;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .badge.none { color: rgba(230,232,255,0.5); }

  /* ── Fields ── */
  .fields { display: grid; gap: 14px; }
  .field-label {
    display: block; font: 600 0.58rem var(--font-mono); letter-spacing: 0.12em;
    text-transform: uppercase; color: rgba(215,220,255,0.6); margin-bottom: 6px;
  }
  .field-value-wrap {
    display: flex; align-items: center; gap: 12px; background: var(--well);
    border: 1px solid rgba(255,255,255,0.06); border-radius: 9px; padding: 10px 14px;
    box-shadow: inset 0 1px 4px rgba(0,0,0,0.35);
  }
  .field-value { flex: 1; font: 500 0.78rem var(--font-mono); color: #d3d6f0; word-break: break-all; }
  .icon-btn {
    background: transparent; border: none; color: rgba(255,255,255,0.55); cursor: pointer;
    padding: 4px; border-radius: 6px; line-height: 0; transition: 0.2s; flex-shrink: 0;
  }
  .icon-btn:hover { color: #fff; background: rgba(255,255,255,0.08); }

  /* ── Multiaddresses ── */
  .addr-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .addr-chip {
    display: flex; align-items: center; gap: 8px; padding: 7px 12px;
    background: var(--well); border: 1px solid rgba(255,255,255,0.07);
    border-left: 3px solid rgba(var(--pink), 0.85); border-radius: 8px;
    font: 500 0.7rem var(--font-mono); color: #dfe2ff;
  }
  .addr-chip.ok { border-left-color: rgb(var(--green)); }
  .addr-chip.fail { border-left-color: rgb(var(--red)); opacity: 0.6; }
  .addr-chip.skip { border-left-color: rgb(var(--amber)); opacity: 0.6; }

  /* ── Toast ── */
  #toast {
    position: fixed; bottom: 28px; right: 28px; z-index: 1000; padding: 12px 22px; border-radius: 12px;
    font: 700 0.72rem var(--font-mono); letter-spacing: 0.08em; color: #fff;
    background: linear-gradient(135deg, rgba(var(--pink), 0.95), rgba(190, 80, 255, 0.9));
    border: 1px solid rgba(255,255,255,0.25); box-shadow: 0 10px 30px rgba(var(--pink), 0.35);
    transform: translateX(120%); transition: transform 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
  }
  #toast.show { transform: translateX(0); }

  .error-msg { font: 600 0.8rem var(--font-mono); color: rgb(var(--red)); letter-spacing: 0.06em; }

  @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

  @media (max-width: 760px) {
    .shell { margin: 10px; padding: 24px 16px 28px; border-radius: 18px; }
    .header { flex-direction: column; gap: 14px; }
    .header-meta { text-align: left; padding-top: 0; }
    .version-row { grid-template-columns: 90px minmax(0, 1fr) 96px; gap: 10px; }
    .tab-btn { padding: 8px 14px; }
    .search-wrap::after { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .pulse::after, .version-fill, .card { animation: none; }
  }
</style>
</head>
<body>

<canvas id="bg-river" aria-hidden="true"></canvas>
<div class="bg-dots" aria-hidden="true"></div>
<div class="bg-vignette" aria-hidden="true"></div>

<div class="shell">
  <header class="header">
    <div class="header-left">
      <h1>Validator Monitor Pro</h1>
      <div class="sys-status">System Node Monitoring // Live Feedback</div>
    </div>
    <div class="header-meta">
      <div class="powered">Powered by <a href="https://github.com/lexnv/subp2p-explorer" target="_blank" rel="noopener noreferrer">SUBP2P/EXPLORER</a></div>
      <div id="update-ts" class="last-updated"></div>
    </div>
  </header>

  <section class="controls">
    <div class="search-wrap">
      <input type="text" id="search-input" class="search-input" placeholder="> TERMINAL_SEARCH: [IDENT / KEY / ADDR]" autocomplete="off" spellcheck="false">
    </div>

    <div class="filter-group">
      <nav class="tabs" id="network-tabs"></nav>

      <div class="actions">
        <button class="action-btn" id="sort-toggle">SORT: <span id="sort-label">HEALTH</span></button>
        <button class="action-btn" id="view-toggle">MODE: <span id="view-label">FULL</span></button>
        <button class="action-btn" id="download-btn">EXPORT_JSON</button>
      </div>
    </div>
  </section>

  <div class="stats-grid" id="stats-summary"></div>

  <div id="version-dist"></div>

  <div id="transport-dist"></div>

  <div id="allnodes-dist"></div>

  <div id="list" class="list-container"></div>
</div>

<div id="toast">DATA_COPIED_TO_CLIPBOARD</div>

<script>
/* ── Animated background: dotted rivers, light streaks, bokeh and looping motes ── */
(function riverBackground() {
  const canvas = document.getElementById('bg-river');
  const ctx = canvas && canvas.getContext('2d', { alpha: false });
  if (!ctx || typeof Path2D === 'undefined') return;

  const TAU = Math.PI * 2;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const RGB = { pink: '255,45,149', cyan: '110,220,255', lav: '190,150,255', white: '235,240,255' };
  const KEYS = Object.keys(RGB);
  const LEVELS = 6;                       // alpha buckets, so thousands of dots become a handful of fills
  const FLOW_ANGLE = 30 * Math.PI / 180;  // rivers run from upper-left to lower-right
  const FLOW = { x: Math.cos(FLOW_ANGLE), y: Math.sin(FLOW_ANGLE) };

  // Seeded PRNG so the scene is stable across resizes.
  let seed = 20260902;
  const rand = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  const rr = (a, b) => a + rand() * (b - a);
  const pick = arr => arr[Math.floor(rand() * arr.length)];
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const hash = n => { const s = Math.sin(n * 12.9898) * 43758.5453; return s - Math.floor(s); };

  let W = 0, H = 0, dpr = 1, quality = 2;
  let streams = [], streaks = [], blobs = [], motes = [];

  // One soft radial sprite per colour; stretched with drawImage into bokeh blobs and light streaks.
  const glow = {};
  for (const k of KEYS) {
    const s = 128, c = document.createElement('canvas');
    c.width = c.height = s;
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    gr.addColorStop(0, `rgba(${RGB[k]},0.8)`);
    gr.addColorStop(0.3, `rgba(${RGB[k]},0.35)`);
    gr.addColorStop(0.7, `rgba(${RGB[k]},0.08)`);
    gr.addColorStop(1, `rgba(${RGB[k]},0)`);
    g.fillStyle = gr;
    g.fillRect(0, 0, s, s);
    glow[k] = c;
  }

  // Parametric distance range [d0, d1] where an infinite line through `anchor`
  // along `dir` intersects the viewport (padded by the stream's wiggle amplitude).
  function clipRange(s) {
    const m = 60 + s.wig[0].amp + s.wig[1].amp;
    let t0 = -Infinity, t1 = Infinity;
    for (const [lo, hi, p, d] of [[-m, W + m, s.anchor.x, s.dir.x], [-m, H + m, s.anchor.y, s.dir.y]]) {
      if (Math.abs(d) < 1e-6) { if (p < lo || p > hi) return null; continue; }
      let a = (lo - p) / d, b = (hi - p) / d;
      if (a > b) { const t = a; a = b; b = t; }
      if (a > t0) t0 = a;
      if (b < t1) t1 = b;
    }
    return t0 <= t1 ? [t0, t1] : null;
  }

  function build() {
    seed = 20260902;
    const diag = Math.hypot(W, H);

    // Rivers: bands of parallel dotted lines that drift along the flow direction.
    streams = [];
    const n = Math.round(clamp(W * H / 150000, 6, 14));
    for (let i = 0; i < n; i++) {
      const ang = FLOW_ANGLE + rr(-8, 8) * Math.PI / 180;
      const dir = { x: Math.cos(ang), y: Math.sin(ang) };
      const dense = rand() < 0.3;               // tight dotted lines that read as solid "data" streams
      const lines = Math.round(dense ? rr(1, 3) : rr(3, 6));
      const spread = rr(5, 11);
      const offsets = [];
      for (let k = 0; k < lines; k++) offsets.push((k - (lines - 1) / 2) * spread + rr(-1.5, 1.5));
      const s = {
        dir, nrm: { x: -dir.y, y: dir.x },
        anchor: { x: rr(-0.05, 1.05) * W, y: rr(-0.05, 1.05) * H },
        offsets,
        wig: [
          { amp: rr(20, 70), f: rr(0.6, 1.4) * TAU / diag, ph: rr(0, TAU) },
          { amp: rr(6, 18), f: rr(2.5, 5) * TAU / diag, ph: rr(0, TAU) },
        ],
        gap: dense ? rr(6, 9) : rr(11, 19),
        speed: rr(18, 55),
        color: pick(['pink', 'pink', 'pink', 'cyan', 'cyan', 'lav', 'white']),
        alpha: rr(0.45, 0.95),
        r: dense ? rr(0.9, 1.4) : rr(1.3, 2.3),
        pulsePeriod: rr(260, 700),
        pulseSpeed: rr(60, 160),
        pulseSharp: rr(2, 6),
        phase: rr(0, 5000),
      };
      s.range = clipRange(s);
      streams.push(s);
    }

    // Light streaks: long soft beams sliding back and forth along the flow.
    streaks = [];
    const ns = Math.round(clamp(W / 90, 8, 20));
    for (let i = 0; i < ns; i++) {
      const kind = rand();
      const wide = kind < 0.3, long = kind > 0.75;
      streaks.push({
        ang: FLOW_ANGLE + rr(-6, 6) * Math.PI / 180,
        cx: rr(0.15, 1.0), cy: rr(0, 1),
        len: wide ? rr(500, 1100) : long ? rr(900, 1600) : rr(250, 800),
        wid: wide ? rr(50, 130) : long ? rr(2, 4) : rr(3, 9),
        color: pick(wide ? ['cyan', 'cyan', 'pink', 'lav'] : ['white', 'white', 'cyan', 'cyan', 'pink', 'lav']),
        alpha: wide ? rr(0.16, 0.3) : rr(0.4, 0.85),
        speed: rr(15, 45),
        fade: rr(0.15, 0.4),
        ph: rr(0, TAU),
        travel: rr(200, 600),
      });
    }

    // Bokeh: big soft colour blobs drifting on slow loops, plus two ambient hazes.
    blobs = [];
    const nb = Math.round(clamp(W / 220, 5, 9));
    for (let i = 0; i < nb; i++) {
      blobs.push({
        cx: rr(0, 1), cy: rr(0, 1), r: rr(110, 320),
        color: pick(['pink', 'pink', 'pink', 'cyan', 'lav']),
        alpha: rr(0.4, 0.8),
        ox: rr(20, 90), oy: rr(20, 90), w: rr(0.05, 0.15), ph: rr(0, TAU),
      });
    }
    for (let i = 0; i < 3; i++) {
      blobs.push({
        cx: rr(0.05, 0.7), cy: rr(0.3, 1), r: rr(60, 140), color: 'pink', alpha: rr(0.7, 1),
        ox: rr(30, 80), oy: rr(30, 80), w: rr(0.08, 0.2), ph: rr(0, TAU),
      });
    }
    blobs.push({ cx: 0.12, cy: 0.85, r: Math.max(W, H) * 0.55, color: 'pink', alpha: 0.5, ox: 40, oy: 30, w: 0.04, ph: 0 });
    blobs.push({ cx: 0.92, cy: 0.15, r: Math.max(W, H) * 0.5, color: 'cyan', alpha: 0.32, ox: 30, oy: 50, w: 0.05, ph: 2 });

    // Motes: small white dots, each circling its own loop while drifting with the flow.
    motes = [];
    const nm = Math.round(clamp(W * H / 14000, 50, 140));
    for (let i = 0; i < nm; i++) {
      motes.push({
        x: rr(0, 1), y: rr(0, 1),
        rx: rr(8, 60), ry: rr(6, 40),
        w: rr(0.15, 0.6) * (rand() < 0.5 ? -1 : 1), ph: rr(0, TAU),
        drift: rr(4, 18), r: rr(0.6, 1.7), tw: rr(0.6, 2.2),
        big: rand() < 0.2,
      });
    }
  }

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, W * H > 2.5e6 ? 1.25 : 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    build();
    if (reduceMotion) draw(0);
  }

  function draw(t) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    const bg = ctx.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, '#0b0d26');
    bg.addColorStop(0.55, '#0a0820');
    bg.addColorStop(1, '#040410');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';

    // Bokeh
    for (const b of blobs) {
      const x = b.cx * W + Math.cos(t * b.w + b.ph) * b.ox;
      const y = b.cy * H + Math.sin(t * b.w * 0.8 + b.ph) * b.oy;
      ctx.globalAlpha = b.alpha;
      ctx.drawImage(glow[b.color], x - b.r, y - b.r, b.r * 2, b.r * 2);
    }

    // Light streaks
    if (quality > 0) {
      for (const s of streaks) {
        const slide = Math.sin(t * s.speed / s.travel + s.ph) * s.travel;
        const x = s.cx * W + Math.cos(s.ang) * slide;
        const y = s.cy * H + Math.sin(s.ang) * slide;
        ctx.globalAlpha = s.alpha * (0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * s.fade + s.ph)));
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.translate(x, y);
        ctx.rotate(s.ang);
        ctx.drawImage(glow[s.color], -s.len / 2, -s.wid / 2, s.len, s.wid);
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    // Rivers of dots. Dots are bucketed by colour and brightness so each bucket is a single fill.
    const paths = {}, halos = {};
    for (const k of KEYS) { paths[k] = new Array(LEVELS).fill(null); halos[k] = null; }
    for (const s of streams) {
      if (!s.range) continue;
      const phase = t * s.speed + s.phase;
      const d0 = s.range[0], d1 = s.range[1];
      const w0 = s.wig[0], w1 = s.wig[1];
      const bucket = paths[s.color];
      for (let li = 0; li < s.offsets.length; li++) {
        if (quality < 1 && (li & 1)) continue;
        const off = s.offsets[li];
        const i0 = Math.ceil((d0 - phase) / s.gap), i1 = Math.floor((d1 - phase) / s.gap);
        for (let i = i0; i <= i1; i++) {
          const d = i * s.gap + phase;
          const w = w0.amp * Math.sin(w0.f * d + w0.ph) + w1.amp * Math.sin(w1.f * d + w1.ph) + off;
          const x = s.anchor.x + s.dir.x * d + s.nrm.x * w;
          const y = s.anchor.y + s.dir.y * d + s.nrm.y * w;
          if (x < -4 || x > W + 4 || y < -4 || y > H + 4) continue;
          // A bright pulse travels along the river on top of the dot motion.
          const p = Math.sin((d - t * s.pulseSpeed) * TAU / s.pulsePeriod);
          const a = s.alpha * (0.3 + 0.7 * Math.pow(Math.max(0, p), s.pulseSharp));
          const lvl = clamp(Math.round(a * LEVELS) - 1, 0, LEVELS - 1);
          const r = s.r * (0.75 + 0.5 * hash(i + off));
          const path = bucket[lvl] || (bucket[lvl] = new Path2D());
          path.moveTo(x + r, y);
          path.arc(x, y, r, 0, TAU);
          if (quality >= 2 && lvl >= 3) {
            const h = halos[s.color] || (halos[s.color] = new Path2D());
            const hr = r * 3;
            h.moveTo(x + hr, y);
            h.arc(x, y, hr, 0, TAU);
          }
        }
      }
    }
    for (const k of KEYS) {
      ctx.fillStyle = `rgb(${RGB[k]})`;
      if (halos[k]) { ctx.globalAlpha = 0.10; ctx.fill(halos[k]); }
      for (let l = 0; l < LEVELS; l++) {
        const p = paths[k][l];
        if (!p) continue;
        ctx.globalAlpha = (l + 1) / LEVELS * 0.95;
        ctx.fill(p);
      }
    }

    // Motes
    const mp = new Array(LEVELS).fill(null);
    const mh = new Path2D();
    const span = 60, PW = W + 2 * span, PH = H + 2 * span;
    for (const m of motes) {
      let bx = m.x * W + FLOW.x * m.drift * t + span;
      let by = m.y * H + FLOW.y * m.drift * t + span;
      bx = ((bx % PW) + PW) % PW - span;
      by = ((by % PH) + PH) % PH - span;
      const x = bx + Math.cos(t * m.w + m.ph) * m.rx;
      const y = by + Math.sin(t * m.w + m.ph) * m.ry;
      if (x < -4 || x > W + 4 || y < -4 || y > H + 4) continue;
      const a = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * m.tw + m.ph * 3));
      const lvl = clamp(Math.round(a * LEVELS) - 1, 0, LEVELS - 1);
      const p = mp[lvl] || (mp[lvl] = new Path2D());
      p.moveTo(x + m.r, y);
      p.arc(x, y, m.r, 0, TAU);
      if (m.big) { const hr = m.r * 4; mh.moveTo(x + hr, y); mh.arc(x, y, hr, 0, TAU); }
    }
    ctx.fillStyle = '#ffffff';
    ctx.globalAlpha = 0.08;
    ctx.fill(mh);
    for (let l = 0; l < LEVELS; l++) {
      if (!mp[l]) continue;
      ctx.globalAlpha = (l + 1) / LEVELS;
      ctx.fill(mp[l]);
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  // Adaptive quality: if frames get expensive, drop halos, then thin the streams.
  let ema = 6, frames = 0;
  function frame(now) {
    const start = performance.now();
    draw(now / 1000);
    ema = ema * 0.9 + (performance.now() - start) * 0.1;
    if (ema > 11 && quality > 0) { quality--; ema = 6; }
    if ((++frames % 30) === 0) { canvas.dataset.frameMs = ema.toFixed(1); canvas.dataset.quality = quality; }
    requestAnimationFrame(frame);
  }

  let resizeTimer;
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 120); });
  resize();
  if (!reduceMotion) requestAnimationFrame(frame);
})();
</script>

<script>
const state = {
  networks: {},
  activeNetwork: '',
  searchQuery: '',
  statusFilter: 'all',
  versionFilter: null,
  transportFilter: null,
  viewMode: 'full',
  sortBy: 'status'
};

const ICON_COPY = `<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M8 4v8a2 2 0 002 2h6a2 2 0 002-2V4a2 2 0 00-2-2h-6a2 2 0 00-2 2z"></path><path d="M16 18v2a2 2 0 01-2 2H6a2 2 0 01-2-2V9a2 2 0 012-2h2"></path></svg>`;

async function init() {
  try {
    const cacheBust = `?t=${Date.now()}`;
    const res = await fetch('networks.json' + cacheBust);
    const files = await res.json();
    const results = await Promise.allSettled(files.map(f =>
      fetch(f + cacheBust).then(r => r.json().then(data => ({ data, lastModified: r.headers.get('Last-Modified') })))
    ));

    results.forEach((res, idx) => {
      if (res.status === 'fulfilled' && res.value.data.chain) {
        const { data, lastModified } = res.value;
        const name = data.chain.toUpperCase();
        state.networks[name] = {
          validators: processValidators(data.authorities),
          stats: data.stats || {},
          // Aggregate stats over every node reached during the crawl
          // (validators and regular network nodes alike); absent in
          // reports generated before the all-nodes report existed.
          allNodes: data.all_nodes || null,
          timestamp: data.timestamp || lastModified || new Date().toISOString(),
          raw: data
        };
      }
    });

    const preferredOrder = ['POLKADOT', 'KUSAMA', 'PASEO', 'WESTEND'];
    const networkNames = Object.keys(state.networks).sort((a, b) => {
      const ia = preferredOrder.indexOf(a), ib = preferredOrder.indexOf(b);
      if (ia !== -1 && ib !== -1) return ia - ib;
      if (ia !== -1) return -1;
      if (ib !== -1) return 1;
      return a.localeCompare(b);
    });
    const ordered = {};
    networkNames.forEach(n => ordered[n] = state.networks[n]);
    state.networks = ordered;
    if (networkNames.length > 0) state.activeNetwork = networkNames[0];
    render();
  } catch (err) {
    console.error(err);
    document.getElementById('list').innerHTML = `<div class="error-msg">CRITICAL_ERROR: FAILED_TO_FETCH_NETWORKS</div>`;
  }
}

function parseAgent(agent) {
  // e.g. "Parity Polkadot/v1.16.1-abcdef123 (validator-name)"
  if (!agent || agent === 'Unknown') return { client: '', version: '' };
  const client = agent.split('/')[0].trim();
  const m = agent.match(/v?(\d+\.\d+\.\d+)/);
  return { client, version: m ? 'v' + m[1] : agent.split('(')[0].trim() };
}

function classifyTransport(addr) {
  // WebSocket addresses also carry a /tcp component, so match the more
  // specific protocols first. Multiaddrs with a path serialize the websocket
  // part as /x-parity-ws or /x-parity-wss.
  if (/\/(x-parity-)?wss?(\/|$)/.test(addr)) return 'WebSocket';
  if (/\/webrtc(-direct)?(\/|$)/.test(addr)) return 'WebRTC';
  if (/\/quic(-v1)?(\/|$)/.test(addr)) return 'QUIC';
  if (/\/tcp\/\d+/.test(addr)) return 'TCP';
  return null;
}

function processValidators(authorities) {
  const list = authorities.map(auth => {
    const addresses = (auth.addresses || []).map(a => {
      const tcp = a.result?.status;
      const dial = a.dial_outcome?.status;
      // Strongest evidence wins: proven reachable > proven failed > never probed.
      let status = 'skip';
      if (dial === 'Success' || tcp === 'Ok') status = 'ok';
      else if (dial === 'Failed' || tcp === 'Failed') status = 'fail';
      return {
        full: a.address_short,
        status,
        isOk: status === 'ok',
        reason: (a.dial_outcome?.reason || a.result?.reason || '').replace(/"/g, '&quot;')
      };
    });
    // Addresses the node reported about itself over the identify protocol.
    const identifyAddresses = auth.identify_addresses || [];
    // Transports across everything the node advertises (DHT + identify).
    const transports = [...new Set(
      [...addresses.map(a => a.full), ...identifyAddresses]
        .map(classifyTransport).filter(Boolean)
    )];
    return {
      key: auth.authority_ss58,
      peerId: auth.peer_id || '',
      identity: auth.identity_name || '',
      agent: auth.agent_version || 'Unknown',
      ...parseAgent(auth.agent_version),
      hasDht: auth.has_dht_record,
      addresses,
      identifyAddresses,
      transports,
      // An identified peer was necessarily connected, even via an address
      // we never probed ourselves (subp2p-explorer#16).
      isOnline: !!auth.agent_version || addresses.some(a => a.isOk)
    };
  });

  // Only prefix the client name when the set actually runs more than one client.
  const multiClient = new Set(list.filter(v => v.client).map(v => v.client)).size > 1;
  list.forEach(v => {
    if (!v.version) {
      v.versionKey = '?';
      v.versionLabel = 'UNIDENTIFIED';
    } else {
      v.versionKey = v.client + '|' + v.version;
      v.versionLabel = multiClient && v.client ? `${v.client} ${v.version}` : v.version;
    }
  });
  return list;
}

function copy(text) {
  const done = () => {
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  };
  const fallback = () => {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    document.body.appendChild(textArea);
    textArea.select();
    document.execCommand('copy');
    document.body.removeChild(textArea);
    done();
  };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
}

function formatTimestamp(ts) {
  const d = new Date(ts);
  if (isNaN(d)) return String(ts);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}, ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

// Summary tile. `filter` makes it a clickable status filter; otherwise it is informational.
function statCard({ theme, label, value, sub = '', filter = null }) {
  const active = filter && state.statusFilter === filter ? 'active' : '';
  const click = filter ? `onclick="setStatusFilter('${filter}')"` : '';
  const copyVal = sub !== '' ? `${value}/${sub}` : String(value);
  return `
    <div class="stat-card ${theme} ${filter ? '' : 'info'} ${active}" ${click}>
      <button class="stat-copy" title="Copy value" onclick="event.stopPropagation(); copy('${copyVal}')">${ICON_COPY}</button>
      <div class="stat-label">${label}</div>
      <div class="stat-value">${value}${sub !== '' ? `<span class="stat-sub">/${sub}</span>` : ''}</div>
    </div>`;
}

function render() {
  const net = state.networks[state.activeNetwork];
  if (!net) return;

  // Render Tabs
  document.getElementById('network-tabs').innerHTML = Object.keys(state.networks).map(name => `
    <button class="tab-btn ${state.activeNetwork === name ? 'active' : ''}" onclick="switchNetwork('${name}')">${name}</button>
  `).join('');

  // Render Stats
  const v = net.validators;
  const s = net.stats;
  const online = v.filter(i => i.isOnline).length;
  let statsHtml = statCard({ theme: 't-pink', label: 'Total Nodes', value: v.length, filter: 'all' })
    + statCard({ theme: 't-green', label: 'Reachable', value: online, filter: 'online' })
    + statCard({ theme: 't-red', label: 'Unreachable', value: v.length - online, filter: 'offline' });
  if (s.with_dht_records != null) statsHtml += statCard({ theme: 't-white', label: 'DHT Records', value: s.with_dht_records });
  if (s.identified != null) statsHtml += statCard({ theme: 't-cyan', label: 'Identified', value: s.identified });
  if (s.total_addresses != null) statsHtml += statCard({ theme: 't-white', label: 'Addrs Reachable', value: s.reachable_public, sub: s.total_addresses });
  if (s.fully_reachable_authorities != null) statsHtml += statCard({ theme: 't-green', label: 'Fully Reachable', value: s.fully_reachable_authorities });
  if (s.libp2p_reachable_authorities != null) statsHtml += statCard({ theme: 't-green', label: 'Libp2p Connected', value: s.libp2p_reachable_authorities });
  if (s.dial_success != null) statsHtml += statCard({ theme: 't-white', label: 'Dials OK / Probed', value: s.dial_success, sub: s.dial_success + (s.dial_failed || 0) });
  document.getElementById('stats-summary').innerHTML = statsHtml;

  renderVersionDist(v);
  renderTransportDist(v);
  renderAllNodes(net.allNodes);
  document.getElementById('update-ts').innerHTML = `<span class="ts-label">LAST_SYNC</span>${formatTimestamp(net.timestamp)}`;
  renderList();
}

function renderAllNodes(all) {
  // Everything the crawler talked to while walking the DHT, not just the
  // validator set. Rows are informational only: there is no per-node data
  // in the report to filter the validator list by.
  const el = document.getElementById('allnodes-dist');
  if (!all) { el.innerHTML = ''; return; }

  const identified = all.identified || 0;
  const pctOf = n => identified ? (n / identified * 100).toFixed(1) : '0.0';

  const t = all.transports || {};
  const rows = [
    { key: 'TCP', count: t.tcp || 0 },
    { key: 'WebSocket', count: t.websocket || 0 },
    { key: 'WebRTC', count: t.webrtc || 0 },
    { key: 'QUIC', count: t.quic || 0 },
  ].filter(r => r.key !== 'QUIC' || r.count > 0);
  if (all.no_known_transport) rows.push({ key: 'UNKNOWN', count: all.no_known_transport });
  const maxCount = Math.max(...rows.map(r => r.count), 1);

  // The whole network runs far more releases than the validator set; keep
  // the panel readable by folding the tail into one row.
  const MAX_VERSIONS = 12;
  const versions = Object.entries(all.agent_versions || {})
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  const shown = versions.slice(0, MAX_VERSIONS);
  const rest = versions.slice(MAX_VERSIONS).reduce((sum, [, c]) => sum + c, 0);
  if (rest > 0) shown.push([`OTHER_VERSIONS [${versions.length - MAX_VERSIONS}]`, rest]);
  const maxVer = Math.max(...shown.map(([, c]) => c), 1);

  el.innerHTML = `
    <div class="panel version-panel">
      <div class="panel-title">Network_Scan // ALL_NODES_REACHED_DURING_CRAWL (VALIDATORS + OTHERS)</div>
      <div class="allnodes-meta">
        <div class="meta-chip"><span class="chip-label">Peers_Connected</span><span class="chip-value">${all.reached_peers ?? '?'}</span></div>
        <div class="meta-chip"><span class="chip-label">Identified</span><span class="chip-value">${identified}</span></div>
        <div class="meta-chip"><span class="chip-label">Validators</span><span class="chip-value">${all.validators ?? 0}</span></div>
        <div class="meta-chip"><span class="chip-label">Other_Nodes</span><span class="chip-value">${all.non_validators ?? 0}</span></div>
      </div>
      <div class="panel-title">Transports // NODES_PER_TRANSPORT (IDENTIFY, % OF IDENTIFIED)</div>
      ${rows.map((row, i) => `
        <div class="version-row static" title="${row.key}: ${row.count} of ${identified} identified nodes (${pctOf(row.count)}%)">
          <span class="version-name">${row.key}</span>
          <div class="version-track"><div class="version-fill net ${row.count === 0 ? 'unknown' : ''}" style="width:${(row.count / maxCount * 100).toFixed(1)}%; animation-delay:${i * 0.04}s"></div></div>
          <span class="version-count">${row.count} <span class="pct">/ ${pctOf(row.count)}%</span></span>
        </div>`).join('')}
      ${shown.length ? `
      <div class="panel-title" style="margin-top:16px">Agent_Versions // ALL_IDENTIFIED_NODES</div>
      ${shown.map(([label, count], i) => `
        <div class="version-row static" title="${esc(label)}: ${count} of ${identified} identified nodes (${pctOf(count)}%)">
          <span class="version-name">${esc(label)}</span>
          <div class="version-track"><div class="version-fill net" style="width:${(count / maxVer * 100).toFixed(1)}%; animation-delay:${i * 0.04}s"></div></div>
          <span class="version-count">${count} <span class="pct">/ ${pctOf(count)}%</span></span>
        </div>`).join('')}` : ''}
    </div>`;
}

function renderTransportDist(validators) {
  // Always show the three transports of interest; QUIC only when present.
  // A validator can run several transports, so rows do not sum to 100%.
  const order = ['TCP', 'WebSocket', 'WebRTC', 'QUIC'];
  const rows = order
    .map(key => ({ key, count: validators.filter(v => v.transports.includes(key)).length }))
    .filter(r => r.key !== 'QUIC' || r.count > 0);

  const maxCount = Math.max(...rows.map(r => r.count), 1);
  document.getElementById('transport-dist').innerHTML = validators.length ? `
    <div class="panel version-panel">
      <div class="panel-title">Transport_Distribution ${state.transportFilter ? '<span class="filter-flag">// FILTER_ACTIVE [CLICK_ROW_TO_CLEAR]</span>' : '// VALIDATORS_PER_TRANSPORT (DHT + IDENTIFY)'}</div>
      ${rows.map((row, i) => {
        const share = (row.count / validators.length * 100).toFixed(1);
        return `
        <div class="version-row ${state.transportFilter === row.key ? 'active' : ''}" onclick="setTransportFilter('${row.key}')" title="${row.key}: ${row.count} of ${validators.length} validators (${share}%)">
          <span class="version-name">${row.key}</span>
          <div class="version-track"><div class="version-fill ${row.count === 0 ? 'unknown' : ''}" style="width:${(row.count / maxCount * 100).toFixed(1)}%; animation-delay:${i * 0.04}s"></div></div>
          <span class="version-count">${row.count} <span class="pct">/ ${share}%</span></span>
        </div>`;
      }).join('')}
    </div>` : '';
}

function renderVersionDist(validators) {
  const dist = {};
  validators.forEach(v => {
    dist[v.versionKey] ??= { key: v.versionKey, label: v.versionLabel, count: 0 };
    dist[v.versionKey].count++;
  });
  const versions = Object.values(dist).sort((a, b) => {
    if (a.key === '?') return 1;
    if (b.key === '?') return -1;
    return b.count - a.count || a.label.localeCompare(b.label);
  });
  state._versions = versions;

  const maxCount = Math.max(...versions.map(x => x.count), 1);
  document.getElementById('version-dist').innerHTML = versions.length ? `
    <div class="panel version-panel">
      <div class="panel-title">Agent_Version_Distribution ${state.versionFilter ? '<span class="filter-flag">// FILTER_ACTIVE [CLICK_ROW_TO_CLEAR]</span>' : '// NODES_PER_RELEASE'}</div>
      ${versions.map((ver, i) => {
        const share = (ver.count / validators.length * 100).toFixed(1);
        return `
        <div class="version-row ${state.versionFilter === ver.key ? 'active' : ''}" onclick="setVersionFilter(${i})" title="${esc(ver.label)}: ${ver.count} of ${validators.length} nodes (${share}%)">
          <span class="version-name">${esc(ver.label)}</span>
          <div class="version-track"><div class="version-fill ${ver.key === '?' ? 'unknown' : ''}" style="width:${(ver.count / maxCount * 100).toFixed(1)}%; animation-delay:${i * 0.04}s"></div></div>
          <span class="version-count">${ver.count} <span class="pct">/ ${share}%</span></span>
        </div>`;
      }).join('')}
    </div>` : '';
}

function renderList() {
  const net = state.networks[state.activeNetwork];
  const container = document.getElementById('list');
  let filtered = net.validators.filter(v => {
    const q = state.searchQuery.toLowerCase();
    const matchSearch = !q || v.identity.toLowerCase().includes(q) || v.key.toLowerCase().includes(q) || v.peerId.toLowerCase().includes(q) || v.agent.toLowerCase().includes(q) || v.addresses.some(a => a.full.toLowerCase().includes(q)) || v.identifyAddresses.some(a => a.toLowerCase().includes(q));
    const matchFilter = state.statusFilter === 'all' || (state.statusFilter === 'online' ? v.isOnline : !v.isOnline);
    const matchVersion = !state.versionFilter || v.versionKey === state.versionFilter;
    const matchTransport = !state.transportFilter || v.transports.includes(state.transportFilter);
    return matchSearch && matchFilter && matchVersion && matchTransport;
  });

  filtered.sort((a, b) => {
    if (state.sortBy === 'status') return a.isOnline === b.isOnline ? 0 : (a.isOnline ? 1 : -1);
    return (a.identity || a.key).localeCompare(b.identity || b.key);
  });

  container.innerHTML = filtered.map((v, i) => `
    <div class="card" style="animation-delay:${Math.min(i, 24) * 0.03}s">
      <div class="card-header">
        <div class="pulse ${v.isOnline ? 'online' : 'offline'}" title="${v.isOnline ? 'Reachable' : 'Unreachable'}"></div>
        <div class="identity-name">${esc(v.identity || shorten(v.key, 12))}</div>
        <div class="badges">
          ${v.transports.map(t => `<span class="badge">${t}</span>`).join('')}
          <span class="badge ${v.hasDht ? '' : 'none'}">${v.hasDht ? 'DHT: OK' : 'DHT: NONE'}</span>
        </div>
      </div>

      <div class="fields" style="${state.viewMode === 'compact' ? 'display:none' : ''}">
        <div class="field">
          <span class="field-label">Authority_Key</span>
          <div class="field-value-wrap">
            <span class="field-value">${v.key}</span>
            <button class="icon-btn" title="Copy" onclick="copy('${v.key}')">${ICON_COPY}</button>
          </div>
        </div>

        <div class="field">
          <span class="field-label">Peer_Identifier</span>
          <div class="field-value-wrap">
            <span class="field-value">${v.peerId || '---'}</span>
            ${v.peerId ? `<button class="icon-btn" title="Copy" onclick="copy('${v.peerId}')">${ICON_COPY}</button>` : ''}
          </div>
        </div>

        ${v.agent && v.agent !== 'Unknown' ? `<div class="field">
          <span class="field-label">Agent_Version</span>
          <div class="field-value-wrap">
            <span class="field-value">${esc(v.agent)}</span>
          </div>
        </div>` : ''}

        <div class="field">
          <span class="field-label">Advertised_Endpoints [${v.addresses.length}]</span>
          <div class="addr-grid">
            ${v.addresses.map(a => `
              <div class="addr-chip ${a.status}"${a.reason ? ` title="${a.reason}"` : ''}>
                <span>${a.full}</span>
                <button class="icon-btn" style="padding:2px" title="Copy" onclick="copy('${a.full}')">${ICON_COPY}</button>
              </div>
            `).join('')}
          </div>
        </div>

        ${v.identifyAddresses.length ? `<div class="field">
          <span class="field-label">Identify_Endpoints [${v.identifyAddresses.length}]${v.transports.length ? ` // ${v.transports.join(' + ')}` : ''}</span>
          <div class="addr-grid">
            ${v.identifyAddresses.map(a => `
              <div class="addr-chip">
                <span>${esc(a)}</span>
                <button class="icon-btn" style="padding:2px" title="Copy" onclick="copy('${esc(a)}')">${ICON_COPY}</button>
              </div>
            `).join('')}
          </div>
        </div>` : ''}
      </div>
    </div>
  `).join('');
}

window.switchNetwork = (n) => { state.activeNetwork = n; state.versionFilter = null; state.transportFilter = null; render(); };
window.setStatusFilter = (f) => { state.statusFilter = f; render(); };
window.setTransportFilter = (key) => {
  state.transportFilter = state.transportFilter === key ? null : key;
  render();
};
window.setVersionFilter = (i) => {
  const key = state._versions?.[i]?.key;
  state.versionFilter = state.versionFilter === key ? null : key;
  render();
};

document.getElementById('search-input').addEventListener('input', e => { state.searchQuery = e.target.value; renderList(); });

document.getElementById('view-toggle').addEventListener('click', () => {
  state.viewMode = state.viewMode === 'full' ? 'compact' : 'full';
  document.getElementById('view-label').textContent = state.viewMode.toUpperCase();
  renderList();
});

document.getElementById('sort-toggle').addEventListener('click', () => {
  state.sortBy = state.sortBy === 'status' ? 'name' : 'status';
  document.getElementById('sort-label').textContent = state.sortBy === 'status' ? 'HEALTH' : 'NAME';
  renderList();
});

document.getElementById('download-btn').addEventListener('click', () => {
  const data = state.networks[state.activeNetwork]?.raw;
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${state.activeNetwork}_REPORT.json`;
  a.click();
});

function shorten(s, l=8) { return s.length <= l*2 ? s : s.slice(0,l)+'...'+s.slice(-l); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

init();
</script>

</body>
</html>
