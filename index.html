<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validator Monitor Pro // System Alpha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #030305;
    --surface: rgba(15, 15, 26, 0.7);
    --surface-hover: rgba(25, 25, 45, 0.85);
    --border: rgba(255, 255, 255, 0.07);
    --border-active: rgba(230, 0, 122, 0.5);
    --text: #f0f0f5;
    --text-dim: #7d7d8f;
    --accent: #e6007a;
    --accent-glow: rgba(230, 0, 122, 0.4);
    --green: #00ffa3;
    --green-glow: rgba(0, 255, 163, 0.3);
    --red: #ff3e3e;
    --red-glow: rgba(255, 62, 62, 0.3);
    --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
    --font-sans: 'Inter', -apple-system, sans-serif;
  }

  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Ambient Background ── */
  .bg-canvas {
    position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(800px 500px at 12% -10%, rgba(230, 0, 122, 0.12), transparent 60%),
      radial-gradient(900px 600px at 88% 110%, rgba(120, 60, 255, 0.08), transparent 60%),
      radial-gradient(circle at 50% 0%, #150f1d 0%, #030305 70%);
  }

  .grid-overlay {
    position: fixed; inset: 0; z-index: -1;
    background-image: 
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(circle at 50% 50%, black, transparent 80%);
    opacity: 0.3;
  }

  /* ── Layout ── */
  .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; position: relative; }
  
  /* ── Header ── */
  .header { margin-bottom: 48px; position: relative; }
  .header h1 { 
    font-size: 2.8rem; font-weight: 900; letter-spacing: -0.05em; 
    text-transform: uppercase; margin-bottom: 4px;
    background: linear-gradient(135deg, #fff 30%, var(--accent));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 10px var(--accent-glow));
  }
  .header .sys-status {
    font-family: var(--font-mono); font-size: 0.7rem; color: var(--accent);
    text-transform: uppercase; letter-spacing: 0.2em; border-left: 2px solid var(--accent);
    padding-left: 10px; margin-bottom: 12px;
  }

  /* ── Controls Row ── */
  .controls-row {
    display: flex; flex-direction: column; gap: 20px; margin-bottom: 32px;
    background: rgba(255, 255, 255, 0.02); padding: 20px; border-radius: 14px;
    border: 1px solid var(--border); backdrop-filter: blur(10px);
  }

  .search-input {
    width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border);
    padding: 14px 14px 14px 48px; border-radius: 10px; color: #fff;
    font-size: 0.9rem; font-family: var(--font-mono); outline: none; transition: 0.2s;
  }
  .search-input:focus { border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }

  .filter-group { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

  /* ── High Tech Buttons ── */
  .tabs { display: flex; gap: 4px; padding: 4px; background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 10px; }
  .tab-btn {
    padding: 8px 24px; border: none; background: transparent; color: var(--text-dim);
    cursor: pointer; font-size: 0.75rem; font-family: var(--font-mono); font-weight: 600;
    text-transform: uppercase; transition: 0.3s; border-radius: 7px;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { background: var(--accent); color: white; box-shadow: 0 0 14px var(--accent-glow); }

  .action-btn {
    background: transparent; border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px;
    font-size: 0.75rem; font-family: var(--font-mono); text-transform: uppercase; transition: 0.2s;
  }
  .action-btn:hover { border-color: var(--accent); background: rgba(230,0,122,0.1); color: var(--accent); }

  /* ── Stats Summary ── */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border); padding: 20px;
    border-radius: 12px; position: relative; transition: 0.3s; overflow: hidden; cursor: pointer;
  }
  .stat-card:hover { transform: translateY(-2px); }
  .stat-card::before {
    content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
    background: var(--text-dim); opacity: 0.3;
  }
  .stat-card:hover { border-color: var(--accent); }
  .stat-card.active { border-color: var(--accent); background: rgba(230, 0, 122, 0.05); }
  .stat-card.active::before { background: var(--accent); opacity: 1; }

  .stat-card.info {
    cursor: default; background: transparent; border-style: dashed; border-color: rgba(255,255,255,0.06);
  }
  .stat-card.info::before { background: var(--text-dim); opacity: 0.15; }
  .stat-card.info:hover { border-color: rgba(255,255,255,0.06); }
  .stat-card.info .stat-value { font-size: 1.5rem; font-weight: 600; opacity: 0.7; }
  .stat-card.info .stat-label { opacity: 0.5; }
  
  .stat-label { color: var(--text-dim); font-size: 0.65rem; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.1em; }
  .stat-value { font-size: 2rem; font-weight: 800; font-family: var(--font-mono); }

  /* ── Version Distribution ── */
  .version-panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px; margin-bottom: 32px; backdrop-filter: blur(10px);
  }
  .panel-title {
    color: var(--text-dim); font-size: 0.65rem; font-family: var(--font-mono);
    text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 14px;
  }
  .panel-title .filter-flag { color: var(--accent); }
  .version-row {
    display: grid; grid-template-columns: 150px minmax(0, 1fr) 110px; gap: 12px;
    align-items: center; padding: 5px 8px; cursor: pointer; border-radius: 8px;
    border-left: 2px solid transparent; transition: 0.2s;
  }
  .version-row:hover { background: rgba(255,255,255,0.04); }
  .version-row.active { background: rgba(230,0,122,0.08); border-left-color: var(--accent); }
  .version-name {
    font-family: var(--font-mono); font-size: 0.75rem; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .version-track { height: 10px; background: rgba(255,255,255,0.05); border-radius: 999px; overflow: hidden; }
  .version-fill {
    height: 100%; background: var(--accent); border-radius: 999px;
    box-shadow: 0 0 8px var(--accent-glow);
    transform-origin: left; animation: growX 0.5s ease-out both;
  }
  .version-fill.unknown { background: var(--text-dim); opacity: 0.45; box-shadow: none; }
  .version-fill.net { background: #8a63ff; box-shadow: 0 0 8px rgba(138, 99, 255, 0.35); }
  .version-count { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text); text-align: right; }
  .version-count .pct { color: var(--text-dim); }
  @keyframes growX { from { transform: scaleX(0); } }

  /* ── All Reached Nodes (network-wide crawl) ── */
  .version-row.static { cursor: default; }
  .version-row.static:hover { background: transparent; }
  .allnodes-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .meta-chip {
    display: flex; align-items: center; gap: 8px; padding: 6px 12px;
    background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 8px;
    font-family: var(--font-mono);
  }
  .meta-chip .chip-label { color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.6rem; }
  .meta-chip .chip-value { color: var(--text); font-weight: 700; font-size: 0.75rem; }

  /* ── Validator List ── */
  .list-container { display: flex; flex-direction: column; gap: 16px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 24px; position: relative; backdrop-filter: blur(12px);
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
  }
  .card:hover {
    border-color: var(--border-active); background: var(--surface-hover);
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45), 0 0 24px rgba(230, 0, 122, 0.07);
  }

  .card-header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
  
  .pulse {
    width: 12px; height: 12px; border-radius: 50%; position: relative;
  }
  .pulse.online { background: var(--green); box-shadow: 0 0 10px var(--green); }
  .pulse.online::after {
    content: ''; position: absolute; inset: -4px; border-radius: 50%;
    border: 2px solid var(--green); animation: pulse-ring 1.5s infinite;
  }
  .pulse.offline { background: var(--red); box-shadow: 0 0 10px var(--red); }

  @keyframes pulse-ring { 0% { transform: scale(0.7); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }
  
  .identity-name { font-weight: 800; font-size: 1.1rem; flex: 1; letter-spacing: -0.02em; text-transform: uppercase; color: #fff; }
  
  .badge {
    font-family: var(--font-mono); font-size: 0.6rem; padding: 4px 12px; border-radius: 999px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
  }

  /* ── Fields ── */
  .fields { display: grid; gap: 16px; }
  .field-label { font-size: 0.6rem; color: var(--accent); font-family: var(--font-mono); text-transform: uppercase; margin-bottom: 4px; display: block; }
  .field-value-wrap {
    display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,0.4);
    padding: 8px 16px; border-left: 3px solid var(--border);
    border-radius: 0 8px 8px 0; transition: 0.3s;
  }
  .card:hover .field-value-wrap { border-left-color: var(--accent); }
  .field-value { font-family: var(--font-mono); font-size: 0.8rem; color: #a1a1b5; word-break: break-all; }

  /* ── Multiaddresses ── */
  .addr-chip {
    display: flex; align-items: center; gap: 8px; padding: 6px 12px;
    background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 8px;
    font-size: 0.7rem; font-family: var(--font-mono); margin-bottom: 4px;
  }
  .addr-chip.ok { border-left: 2px solid var(--green); }
  .addr-chip.fail { border-left: 2px solid var(--red); opacity: 0.6; }
  .addr-chip.skip { border-left: 2px solid #ffb340; opacity: 0.6; }

  /* ── Toast ── */
  #toast {
    position: fixed; bottom: 30px; right: 30px; background: var(--accent);
    color: #fff; padding: 12px 24px; font-family: var(--font-mono); font-weight: 700;
    border-radius: 10px; box-shadow: 0 8px 24px rgba(230, 0, 122, 0.35);
    transform: translateX(120%); transition: 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28); z-index: 1000;
  }
  #toast.show { transform: translateX(0); }

  .header-meta {
    display: flex; flex-direction: column; align-items: flex-end; gap: 2px; margin-top: 10px;
  }
  .last-updated {
    color: var(--text-dim); font-size: 0.65rem; font-family: var(--font-mono); opacity: 0.6;
  }

</style>
</head>
<body>

<div class="bg-canvas"></div>
<div class="grid-overlay"></div>

<div class="container">
  <header class="header">
    <div class="sys-status">System Node Monitoring // Live Feedback</div>
    <h1>Validator Monitor <span style="color:var(--accent)">Pro</span></h1>
    <div class="header-meta">
      <div id="update-ts" class="last-updated"></div>
      <div class="last-updated">POWERED_BY: <a href="https://github.com/lexnv/subp2p-explorer" target="_blank" rel="noopener noreferrer" style="color:var(--accent);text-decoration:none;font-weight:700">subp2p-explorer</a></div>
    </div>
  </header>

  <div class="controls-row">
    <div style="position: relative;">
      <input type="text" id="search-input" class="search-input" placeholder="> TERMINAL_SEARCH: [IDENT / KEY / ADDR]">
    </div>

    <div class="filter-group">
      <nav class="tabs" id="network-tabs"></nav>
      
      <div style="display: flex; gap: 8px;">
        <button class="action-btn" id="sort-toggle">
          SORT: <span id="sort-label">HEALTH</span>
        </button>
        <button class="action-btn" id="view-toggle">
          MODE: <span id="view-label">FULL</span>
        </button>
        <button class="action-btn" id="download-btn">EXPORT_JSON</button>
      </div>
    </div>
  </div>

  <div class="stats-grid" id="stats-summary"></div>

  <div id="version-dist"></div>

  <div id="transport-dist"></div>

  <div id="allnodes-dist"></div>

  <div id="list" class="list-container"></div>
</div>

<div id="toast">DATA_COPIED_TO_CLIPBOARD</div>

<script>
const state = {
  networks: {},
  activeNetwork: '',
  searchQuery: '',
  statusFilter: 'all',
  versionFilter: null,
  transportFilter: null,
  viewMode: 'full',
  sortBy: 'status'
};

const ICON_COPY = `<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M8 4v8a2 2 0 002 2h6a2 2 0 002-2V4a2 2 0 00-2-2h-6a2 2 0 00-2 2z"></path><path d="M16 18v2a2 2 0 01-2 2H6a2 2 0 01-2-2V9a2 2 0 012-2h2"></path></svg>`;

async function init() {
  try {
    const cacheBust = `?t=${Date.now()}`;
    const res = await fetch('networks.json' + cacheBust);
    const files = await res.json();
    const results = await Promise.allSettled(files.map(f =>
      fetch(f + cacheBust).then(r => r.json().then(data => ({ data, lastModified: r.headers.get('Last-Modified') })))
    ));

    results.forEach((res, idx) => {
      if (res.status === 'fulfilled' && res.value.data.chain) {
        const { data, lastModified } = res.value;
        const name = data.chain.toUpperCase();
        state.networks[name] = {
          validators: processValidators(data.authorities),
          stats: data.stats || {},
          // Aggregate stats over every node reached during the crawl
          // (validators and regular network nodes alike); absent in
          // reports generated before the all-nodes report existed.
          allNodes: data.all_nodes || null,
          timestamp: data.timestamp || lastModified || new Date().toISOString(),
          raw: data
        };
      }
    });

    const preferredOrder = ['POLKADOT', 'KUSAMA', 'PASEO', 'WESTEND'];
    const networkNames = Object.keys(state.networks).sort((a, b) => {
      const ia = preferredOrder.indexOf(a), ib = preferredOrder.indexOf(b);
      if (ia !== -1 && ib !== -1) return ia - ib;
      if (ia !== -1) return -1;
      if (ib !== -1) return 1;
      return a.localeCompare(b);
    });
    const ordered = {};
    networkNames.forEach(n => ordered[n] = state.networks[n]);
    state.networks = ordered;
    if (networkNames.length > 0) state.activeNetwork = networkNames[0];
    render();
  } catch (err) {
    console.error(err);
    document.getElementById('list').innerHTML = `<div style="font-family:var(--font-mono); color:var(--red);">CRITICAL_ERROR: FAILED_TO_FETCH_NETWORKS</div>`;
  }
}

function parseAgent(agent) {
  // e.g. "Parity Polkadot/v1.16.1-abcdef123 (validator-name)"
  if (!agent || agent === 'Unknown') return { client: '', version: '' };
  const client = agent.split('/')[0].trim();
  const m = agent.match(/v?(\d+\.\d+\.\d+)/);
  return { client, version: m ? 'v' + m[1] : agent.split('(')[0].trim() };
}

function classifyTransport(addr) {
  // WebSocket addresses also carry a /tcp component, so match the more
  // specific protocols first. Multiaddrs with a path serialize the websocket
  // part as /x-parity-ws or /x-parity-wss.
  if (/\/(x-parity-)?wss?(\/|$)/.test(addr)) return 'WebSocket';
  if (/\/webrtc(-direct)?(\/|$)/.test(addr)) return 'WebRTC';
  if (/\/quic(-v1)?(\/|$)/.test(addr)) return 'QUIC';
  if (/\/tcp\/\d+/.test(addr)) return 'TCP';
  return null;
}

function processValidators(authorities) {
  const list = authorities.map(auth => {
    const addresses = (auth.addresses || []).map(a => {
      const tcp = a.result?.status;
      const dial = a.dial_outcome?.status;
      // Strongest evidence wins: proven reachable > proven failed > never probed.
      let status = 'skip';
      if (dial === 'Success' || tcp === 'Ok') status = 'ok';
      else if (dial === 'Failed' || tcp === 'Failed') status = 'fail';
      return {
        full: a.address_short,
        status,
        isOk: status === 'ok',
        reason: (a.dial_outcome?.reason || a.result?.reason || '').replace(/"/g, '&quot;')
      };
    });
    // Addresses the node reported about itself over the identify protocol.
    const identifyAddresses = auth.identify_addresses || [];
    // Transports across everything the node advertises (DHT + identify).
    const transports = [...new Set(
      [...addresses.map(a => a.full), ...identifyAddresses]
        .map(classifyTransport).filter(Boolean)
    )];
    return {
      key: auth.authority_ss58,
      peerId: auth.peer_id || '',
      identity: auth.identity_name || '',
      agent: auth.agent_version || 'Unknown',
      ...parseAgent(auth.agent_version),
      hasDht: auth.has_dht_record,
      addresses,
      identifyAddresses,
      transports,
      // An identified peer was necessarily connected, even via an address
      // we never probed ourselves (subp2p-explorer#16).
      isOnline: !!auth.agent_version || addresses.some(a => a.isOk)
    };
  });

  // Only prefix the client name when the set actually runs more than one client.
  const multiClient = new Set(list.filter(v => v.client).map(v => v.client)).size > 1;
  list.forEach(v => {
    if (!v.version) {
      v.versionKey = '?';
      v.versionLabel = 'UNIDENTIFIED';
    } else {
      v.versionKey = v.client + '|' + v.version;
      v.versionLabel = multiClient && v.client ? `${v.client} ${v.version}` : v.version;
    }
  });
  return list;
}

function copy(text) {
  const textArea = document.createElement("textarea");
  textArea.value = text;
  document.body.appendChild(textArea);
  textArea.select();
  document.execCommand('copy');
  document.body.removeChild(textArea);
  const toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

function render() {
  const net = state.networks[state.activeNetwork];
  if (!net) return;

  // Render Tabs
  document.getElementById('network-tabs').innerHTML = Object.keys(state.networks).map(name => `
    <button class="tab-btn ${state.activeNetwork === name ? 'active' : ''}" onclick="switchNetwork('${name}')">${name}</button>
  `).join('');

  // Render Stats
  const v = net.validators;
  const s = net.stats;
  const online = v.filter(i => i.isOnline).length;
  let statsHtml = `
    <div class="stat-card ${state.statusFilter === 'all' ? 'active' : ''}" onclick="setStatusFilter('all')">
      <div class="stat-label">Total Nodes</div>
      <div class="stat-value">${v.length}</div>
    </div>
    <div class="stat-card ${state.statusFilter === 'online' ? 'active' : ''}" onclick="setStatusFilter('online')">
      <div class="stat-label">Reachable</div>
      <div class="stat-value" style="color:var(--green)">${online}</div>
    </div>
    <div class="stat-card ${state.statusFilter === 'offline' ? 'active' : ''}" onclick="setStatusFilter('offline')">
      <div class="stat-label">Unreachable</div>
      <div class="stat-value" style="color:var(--red)">${v.length - online}</div>
    </div>
  `;
  if (s.with_dht_records != null) statsHtml += `
    <div class="stat-card info">
      <div class="stat-label">DHT Records</div>
      <div class="stat-value">${s.with_dht_records}</div>
    </div>`;
  if (s.identified != null) statsHtml += `
    <div class="stat-card info">
      <div class="stat-label">Identified</div>
      <div class="stat-value">${s.identified}</div>
    </div>`;
  if (s.total_addresses != null) statsHtml += `
    <div class="stat-card info">
      <div class="stat-label">Addrs Reachable</div>
      <div class="stat-value">${s.reachable_public}<span style="font-size:1rem;color:var(--text-dim)">/${s.total_addresses}</span></div>
    </div>`;
  if (s.fully_reachable_authorities != null) statsHtml += `
    <div class="stat-card info">
      <div class="stat-label">Fully Reachable</div>
      <div class="stat-value" style="color:var(--green)">${s.fully_reachable_authorities}</div>
    </div>`;
  if (s.libp2p_reachable_authorities != null) statsHtml += `
    <div class="stat-card info">
      <div class="stat-label">Libp2p Connected</div>
      <div class="stat-value" style="color:var(--green)">${s.libp2p_reachable_authorities}</div>
    </div>`;
  if (s.dial_success != null) statsHtml += `
    <div class="stat-card info">
      <div class="stat-label">Dials OK / Probed</div>
      <div class="stat-value">${s.dial_success}<span style="font-size:1rem;color:var(--text-dim)">/${s.dial_success + (s.dial_failed || 0)}</span></div>
    </div>`;
  document.getElementById('stats-summary').innerHTML = statsHtml;

  renderVersionDist(v);
  renderTransportDist(v);
  renderAllNodes(net.allNodes);
  document.getElementById('update-ts').textContent = `LAST_SYNC: ${new Date(net.timestamp).toLocaleString()}`;
  renderList();
}

function renderAllNodes(all) {
  // Everything the crawler talked to while walking the DHT, not just the
  // validator set. Rows are informational only: there is no per-node data
  // in the report to filter the validator list by.
  const el = document.getElementById('allnodes-dist');
  if (!all) { el.innerHTML = ''; return; }

  const identified = all.identified || 0;
  const pctOf = n => identified ? (n / identified * 100).toFixed(1) : '0.0';

  const t = all.transports || {};
  const rows = [
    { key: 'TCP', count: t.tcp || 0 },
    { key: 'WebSocket', count: t.websocket || 0 },
    { key: 'WebRTC', count: t.webrtc || 0 },
    { key: 'QUIC', count: t.quic || 0 },
  ].filter(r => r.key !== 'QUIC' || r.count > 0);
  if (all.no_known_transport) rows.push({ key: 'UNKNOWN', count: all.no_known_transport });
  const maxCount = Math.max(...rows.map(r => r.count), 1);

  // The whole network runs far more releases than the validator set; keep
  // the panel readable by folding the tail into one row.
  const MAX_VERSIONS = 12;
  const versions = Object.entries(all.agent_versions || {})
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  const shown = versions.slice(0, MAX_VERSIONS);
  const rest = versions.slice(MAX_VERSIONS).reduce((sum, [, c]) => sum + c, 0);
  if (rest > 0) shown.push([`OTHER_VERSIONS [${versions.length - MAX_VERSIONS}]`, rest]);
  const maxVer = Math.max(...shown.map(([, c]) => c), 1);

  el.innerHTML = `
    <div class="version-panel">
      <div class="panel-title">Network_Scan // ALL_NODES_REACHED_DURING_CRAWL (VALIDATORS + OTHERS)</div>
      <div class="allnodes-meta">
        <div class="meta-chip"><span class="chip-label">Peers_Connected</span><span class="chip-value">${all.reached_peers ?? '?'}</span></div>
        <div class="meta-chip"><span class="chip-label">Identified</span><span class="chip-value">${identified}</span></div>
        <div class="meta-chip"><span class="chip-label">Validators</span><span class="chip-value">${all.validators ?? 0}</span></div>
        <div class="meta-chip"><span class="chip-label">Other_Nodes</span><span class="chip-value">${all.non_validators ?? 0}</span></div>
      </div>
      <div class="panel-title">Transports // NODES_PER_TRANSPORT (IDENTIFY, % OF IDENTIFIED)</div>
      ${rows.map((row, i) => `
        <div class="version-row static" title="${row.key}: ${row.count} of ${identified} identified nodes (${pctOf(row.count)}%)">
          <span class="version-name">${row.key}</span>
          <div class="version-track"><div class="version-fill net ${row.count === 0 ? 'unknown' : ''}" style="width:${(row.count / maxCount * 100).toFixed(1)}%; animation-delay:${i * 0.04}s"></div></div>
          <span class="version-count">${row.count} <span class="pct">/ ${pctOf(row.count)}%</span></span>
        </div>`).join('')}
      ${shown.length ? `
      <div class="panel-title" style="margin-top:14px">Agent_Versions // ALL_IDENTIFIED_NODES</div>
      ${shown.map(([label, count], i) => `
        <div class="version-row static" title="${esc(label)}: ${count} of ${identified} identified nodes (${pctOf(count)}%)">
          <span class="version-name">${esc(label)}</span>
          <div class="version-track"><div class="version-fill net" style="width:${(count / maxVer * 100).toFixed(1)}%; animation-delay:${i * 0.04}s"></div></div>
          <span class="version-count">${count} <span class="pct">/ ${pctOf(count)}%</span></span>
        </div>`).join('')}` : ''}
    </div>`;
}

function renderTransportDist(validators) {
  // Always show the three transports of interest; QUIC only when present.
  // A validator can run several transports, so rows do not sum to 100%.
  const order = ['TCP', 'WebSocket', 'WebRTC', 'QUIC'];
  const rows = order
    .map(key => ({ key, count: validators.filter(v => v.transports.includes(key)).length }))
    .filter(r => r.key !== 'QUIC' || r.count > 0);

  const maxCount = Math.max(...rows.map(r => r.count), 1);
  document.getElementById('transport-dist').innerHTML = validators.length ? `
    <div class="version-panel">
      <div class="panel-title">Transport_Distribution ${state.transportFilter ? '<span class="filter-flag">// FILTER_ACTIVE [CLICK_ROW_TO_CLEAR]</span>' : '// VALIDATORS_PER_TRANSPORT (DHT + IDENTIFY)'}</div>
      ${rows.map((row, i) => {
        const share = (row.count / validators.length * 100).toFixed(1);
        return `
        <div class="version-row ${state.transportFilter === row.key ? 'active' : ''}" onclick="setTransportFilter('${row.key}')" title="${row.key}: ${row.count} of ${validators.length} validators (${share}%)">
          <span class="version-name">${row.key}</span>
          <div class="version-track"><div class="version-fill ${row.count === 0 ? 'unknown' : ''}" style="width:${(row.count / maxCount * 100).toFixed(1)}%; animation-delay:${i * 0.04}s"></div></div>
          <span class="version-count">${row.count} <span class="pct">/ ${share}%</span></span>
        </div>`;
      }).join('')}
    </div>` : '';
}

function renderVersionDist(validators) {
  const dist = {};
  validators.forEach(v => {
    dist[v.versionKey] ??= { key: v.versionKey, label: v.versionLabel, count: 0 };
    dist[v.versionKey].count++;
  });
  const versions = Object.values(dist).sort((a, b) => {
    if (a.key === '?') return 1;
    if (b.key === '?') return -1;
    return b.count - a.count || a.label.localeCompare(b.label);
  });
  state._versions = versions;

  const maxCount = Math.max(...versions.map(x => x.count), 1);
  document.getElementById('version-dist').innerHTML = versions.length ? `
    <div class="version-panel">
      <div class="panel-title">Agent_Version_Distribution ${state.versionFilter ? '<span class="filter-flag">// FILTER_ACTIVE [CLICK_ROW_TO_CLEAR]</span>' : '// NODES_PER_RELEASE'}</div>
      ${versions.map((ver, i) => {
        const share = (ver.count / validators.length * 100).toFixed(1);
        return `
        <div class="version-row ${state.versionFilter === ver.key ? 'active' : ''}" onclick="setVersionFilter(${i})" title="${esc(ver.label)}: ${ver.count} of ${validators.length} nodes (${share}%)">
          <span class="version-name">${esc(ver.label)}</span>
          <div class="version-track"><div class="version-fill ${ver.key === '?' ? 'unknown' : ''}" style="width:${(ver.count / maxCount * 100).toFixed(1)}%; animation-delay:${i * 0.04}s"></div></div>
          <span class="version-count">${ver.count} <span class="pct">/ ${share}%</span></span>
        </div>`;
      }).join('')}
    </div>` : '';
}

function renderList() {
  const net = state.networks[state.activeNetwork];
  const container = document.getElementById('list');
  let filtered = net.validators.filter(v => {
    const q = state.searchQuery.toLowerCase();
    const matchSearch = !q || v.identity.toLowerCase().includes(q) || v.key.toLowerCase().includes(q) || v.peerId.toLowerCase().includes(q) || v.agent.toLowerCase().includes(q) || v.addresses.some(a => a.full.toLowerCase().includes(q)) || v.identifyAddresses.some(a => a.toLowerCase().includes(q));
    const matchFilter = state.statusFilter === 'all' || (state.statusFilter === 'online' ? v.isOnline : !v.isOnline);
    const matchVersion = !state.versionFilter || v.versionKey === state.versionFilter;
    const matchTransport = !state.transportFilter || v.transports.includes(state.transportFilter);
    return matchSearch && matchFilter && matchVersion && matchTransport;
  });

  filtered.sort((a, b) => {
    if (state.sortBy === 'status') return a.isOnline === b.isOnline ? 0 : (a.isOnline ? 1 : -1);
    return (a.identity || a.key).localeCompare(b.identity || b.key);
  });

  container.innerHTML = filtered.map((v, i) => `
    <div class="card" style="animation: slideIn 0.3s ease-out both ${i * 0.02}s">
      <div class="card-header">
        <div class="pulse ${v.isOnline ? 'online' : 'offline'}"></div>
        <div class="identity-name">${v.identity || shorten(v.key, 12)}</div>
        ${v.transports.map(t => `<div class="badge">${t}</div>`).join('')}
        <div class="badge">${v.hasDht ? 'DHT: OK' : 'DHT: NONE'}</div>
      </div>
      
      <div class="fields" style="${state.viewMode === 'compact' ? 'display:none' : ''}">
        <div class="field">
          <span class="field-label">Authority_Key</span>
          <div class="field-value-wrap">
            <span class="field-value">${v.key}</span>
            <button class="action-btn" style="padding:4px" onclick="copy('${v.key}')">${ICON_COPY}</button>
          </div>
        </div>

        <div class="field">
          <span class="field-label">Peer_Identifier</span>
          <div class="field-value-wrap">
            <span class="field-value">${v.peerId || '---'}</span>
            ${v.peerId ? `<button class="action-btn" style="padding:4px" onclick="copy('${v.peerId}')">${ICON_COPY}</button>` : ''}
          </div>
        </div>

        ${v.agent && v.agent !== 'Unknown' ? `<div class="field">
          <span class="field-label">Agent_Version</span>
          <div class="field-value-wrap">
            <span class="field-value">${v.agent}</span>
          </div>
        </div>` : ''}

        <div class="field">
          <span class="field-label">Advertised_Endpoints [${v.addresses.length}]</span>
          <div class="addr-grid" style="display:flex; flex-wrap:wrap; gap:8px;">
            ${v.addresses.map(a => `
              <div class="addr-chip ${a.status}"${a.reason ? ` title="${a.reason}"` : ''}>
                <span>${a.full}</span>
                <button class="action-btn" style="padding:2px; border:none;" onclick="copy('${a.full}')">${ICON_COPY}</button>
              </div>
            `).join('')}
          </div>
        </div>

        ${v.identifyAddresses.length ? `<div class="field">
          <span class="field-label">Identify_Endpoints [${v.identifyAddresses.length}]${v.transports.length ? ` // ${v.transports.join(' + ')}` : ''}</span>
          <div class="addr-grid" style="display:flex; flex-wrap:wrap; gap:8px;">
            ${v.identifyAddresses.map(a => `
              <div class="addr-chip">
                <span>${esc(a)}</span>
                <button class="action-btn" style="padding:2px; border:none;" onclick="copy('${esc(a)}')">${ICON_COPY}</button>
              </div>
            `).join('')}
          </div>
        </div>` : ''}
      </div>
    </div>
  `).join('');
}

window.switchNetwork = (n) => { state.activeNetwork = n; state.versionFilter = null; state.transportFilter = null; render(); };
window.setStatusFilter = (f) => { state.statusFilter = f; render(); };
window.setTransportFilter = (key) => {
  state.transportFilter = state.transportFilter === key ? null : key;
  render();
};
window.setVersionFilter = (i) => {
  const key = state._versions?.[i]?.key;
  state.versionFilter = state.versionFilter === key ? null : key;
  render();
};

document.getElementById('search-input').addEventListener('input', e => { state.searchQuery = e.target.value; renderList(); });

document.getElementById('view-toggle').addEventListener('click', () => {
  state.viewMode = state.viewMode === 'full' ? 'compact' : 'full';
  document.getElementById('view-label').textContent = state.viewMode.toUpperCase();
  renderList();
});

document.getElementById('sort-toggle').addEventListener('click', () => {
  state.sortBy = state.sortBy === 'status' ? 'name' : 'status';
  document.getElementById('sort-label').textContent = state.sortBy === 'status' ? 'HEALTH' : 'NAME';
  renderList();
});

document.getElementById('download-btn').addEventListener('click', () => {
  const data = state.networks[state.activeNetwork]?.raw;
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${state.activeNetwork}_REPORT.json`;
  a.click();
});

function shorten(s, l=8) { return s.length <= l*2 ? s : s.slice(0,l)+'...'+s.slice(-l); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

init();
</script>

<style>
@keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
</style>

</body>
</html>
